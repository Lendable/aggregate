name: "Composer cache"

permissions:
  contents: read

concurrency:
  group: "composer-cache-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/composer-cache.yaml"
      - "composer.json"
      - "composer.lock"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  COMPOSER_MAX_PARALLEL_HTTP: "4"

jobs:
  warm:
    name: "Warm (PHP ${{ matrix.php-version }} with ${{ matrix.dependencies }} deps)"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dependencies:
          - "lowest"
          - "highest"
          - "locked"
        php-version:
          - "8.4"
          - "8.5"
          - "8.6"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1

      - name: "Update Composer platform version"
        if: ${{ matrix.dependencies != 'locked' && matrix.php-version != '8.4' }}
        shell: bash
        run: "composer config platform.php ${{ matrix.php-version }}"

      - name: "Warm Composer cache"
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "${{ matrix.php-version == '8.6' && '--ignore-platform-req=php+' || '' }}"
